name: Build & attach release asset

# When you publish a GitHub Release (tag it with the version, e.g. v1.1.0),
# this builds the clean plugin ZIP and attaches it as
# "social-proof-for-hivepress.zip", so the always-latest download URL and the
# in-plugin updater keep working without any manual upload.
#
# You can also run it by hand from the Actions tab (workflow_dispatch).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build ZIP
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload asset to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/social-proof-for-hivepress.zip

      - name: Save ZIP as a build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: social-proof-for-hivepress
          path: dist/social-proof-for-hivepress.zip
